model:
  provider: gemma
  model_id: google/gemma-3-12b-it
  quantization: 4bit
  device_map: gemma_12b_laptop
  cpu_offload: true
  max_new_tokens: 512
  temperature: 0.0

benchmark:
  dataset: datasets/ground_truth.jsonl
  prompt: prompts/analyze_image.txt
  results_dir: results
  reports_dir: reports

generation:
  do_sample: false
