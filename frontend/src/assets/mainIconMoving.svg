<radialGradient id="paint2_radial_64_3523" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(46.5002 16.5) rotate(90) scale(8.5 0.885417)">
<stop offset="0.0364583" stop-color="#FFF1E4"/>
<stop offset="1" stop-color="#3A71FF" stop-opacity="0"/>
</radialGradient>

<radialGradient id="paint3_radial_64_3523" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(46.5 16.5) rotate(90) scale(8.5 0.885416)">
<stop offset="0.0364583" stop-color="#FFF1E4"/>
<stop offset="1" stop-color="#3A71FF" stop-opacity="0"/>
