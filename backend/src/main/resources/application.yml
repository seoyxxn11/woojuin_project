spring:
  application:
    name: woojuin
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/woojuin}
    username: ${DB_USERNAME:woojuin}
    password: ${DB_PASSWORD:woojuin-local}
  jpa:
    hibernate:
      ddl-auto: update   # 개발용. 운영 전환 시 validate + 마이그레이션 도구 검토
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
            scope: openid, email, profile
        # 카카오는 client-id/secret 발급 후 재추가 예정 (S15P11C105-31 후속 사이클).
        # 빈 값인 채로 registration을 등록해두면 ClientRegistration 검증에서
        # "clientId cannot be empty"로 부팅 자체가 실패하니 그 전엔 비워둔다.

woojuin:
  oauth:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:5173/oauth/callback}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-bytes}
    access-token-validity: 3600000      # 1h
    refresh-token-validity: 1209600000  # 14d
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
  queue:
    stream-key: woojuin:item-processing
    consumer-group: ai-workers
    max-delivery: 3            # 이 횟수만큼 배달·재시도한 뒤에도 실패하면 FAILED 확정
    reclaim-idle-ms: 60000     # pending이 이 시간 이상 방치되면 회수 대상(처리 중 유예)
    reclaim-interval-ms: 30000 # 회수 스케줄러 실행 주기
    reclaim-batch-size: 32     # 한 주기에 살펴볼 pending 최대 건수
  fetch:
    timeout-ms: 5000
    max-body-bytes: 3145728   # 3MB. 미리보기/본문 추출에 이보다 큰 HTML은 불필요
    max-redirects: 5
  crawler:
    # Scrapling 사이드카 폴백. crawler는 docker-compose에 포함돼 함께 뜨므로 기본 켜둔다.
    # 크롤러 없이 백엔드만 돌릴 땐 CRAWLER_ENABLED=false로 끄면 Jsoup 결과만 쓴다.
    enabled: ${CRAWLER_ENABLED:true}
    base-url: ${CRAWLER_BASE_URL:http://localhost:8001}
    timeout-ms: 40000                # 브라우저 렌더가 느려 크롤러 자체 타임아웃보다 넉넉히
    fallback-min-text-length: 200    # Jsoup 본문이 이보다 짧고 og:title도 없으면 폴백

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:woojuin-items}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}   # 로컬 MinIO. 운영(AWS S3)에서는 빈 값으로 오버라이드
    access-key: ${AWS_S3_ACCESS_KEY:woojuin}
    secret-key: ${AWS_S3_SECRET_KEY:woojuin-local}
