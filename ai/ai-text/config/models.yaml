models:
  - id: qwen-local
    provider: ollama
    model: qwen3:8b
    enabled: true
    purpose: 로컬 모델 기준점
    inputTypes:
      - text
    testModes:
      - category-only
      - summary-only
      - metadata-only
      - integrated

  - id: openai-gpt-5-nano
    provider: openai
    model: gpt-5-nano
    enabled: true
    purpose: 최저 비용 API 모델의 최소 성능 확인
    inputTypes:
      - text
    testModes:
      - category-only
      - summary-only
      - metadata-only
      - integrated

  - id: openai-gpt-5-mini
    provider: openai
    model: gpt-5-mini
    enabled: true
    purpose: 비용과 품질의 균형형 운영 후보
    inputTypes:
      - text
    testModes:
      - category-only
      - summary-only
      - metadata-only
      - integrated
