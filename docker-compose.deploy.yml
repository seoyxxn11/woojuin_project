# 서버(EC2) 배포용 스택 — test/prod 공용
#
# 로컬 개발용 docker-compose.yml 과는 별개 파일이다.
#   - 로컬용: 인프라만(postgres/redis/minio/crawler), 백엔드는 IDE에서 실행
#   - 이 파일: 백엔드까지 포함한 풀스택 + 하드닝(격리·자원제한·헬스체크)
#
# 한 파일로 dev/prod 두 환경을 같은 EC2에 띄운다(결정 #16).
# 그래서 container_name 을 쓰지 않고(=프로젝트명 접두사가 붙게), 호스트 포트는 변수로 뺀다.
#
#   docker compose -p woojuin-prod --env-file .env.prod -f docker-compose.deploy.yml up -d
#   docker compose -p woojuin-dev  --env-file .env.dev  -f docker-compose.deploy.yml up -d
#
# 정문은 컨테이너 nginx가 아니라 **호스트 nginx**다(기존 HTTPS·Jenkins 프록시 보존).
# 호스트 nginx가 api.woojuin.store → 127.0.0.1:${BACKEND_HOST_PORT} 로 프록시한다.
#
# 값은 --env-file 로 넘긴 파일에서 온다. 어떤 키가 필요한지는 아래 environment
# 블록의 ${...} 를 보면 된다. 실제 .env 파일은 서버에만 두고 커밋하지 않는다.
#
# ${VAR:?} = 필수. 값이 없거나 **빈 문자열**이면 compose 가 기동을 거부한다.
# ${VAR:-기본값} = 옵셔널.
# 그냥 ${VAR} 로 두면 compose 는 경고만 찍고 빈 문자열을 넣어버려서, .env 의 오타·누락이
# 60초 뒤 앱 로그에서야 드러난다. 그래서 필수 값에는 전부 :? 를 붙였다.

services:
  postgres:
    image: postgres:16-alpine
    # 같은 키가 아래 healthcheck 에도 나오지만, :? 는 한 곳에만 붙여도
    # 그 변수가 비면 파일 전체 해석이 실패하므로 여기서만 표시한다.
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    # 루프백만 바인딩. 로컬 DBeaver는 SSH 터널로 접속(결정 #5)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    restart: always
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    # 호스트 바인딩 없음 = 외부 도달 경로 0. backend만 internal 네트워크로 접근
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY:?}
    # S3 API(9000)는 호스트에 아예 노출하지 않는다.
    # 백엔드가 업로드/다운로드를 중계하는 구조라(presigned URL 미사용) 브라우저가
    # MinIO에 직접 접근할 일이 없다 → 외부 노출 이유가 없음.
    # 콘솔(9001)만 루프백에 열어 두고 관리 접속은 SSH 터널로 한다.
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:?}:9001"
    volumes:
      - minio-data:/data
    networks: [internal]
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Scrapling 크롤러 사이드카(폴백 전용).
  # Jsoup이 JS 렌더링·봇차단 페이지에서 실패할 때만 호출된다(crawler/README.md).
  # 실제 브라우저(camoufox)를 띄우므로 이 스택에서 가장 무거운 서비스다.
  #   - 메모리 스파이크 주의: 동시 렌더 수 × 수백MB~1GB
  #   - 이미지 빌드가 오래 걸린다(브라우저 바이너리 다운로드) → CI는 crawler/ 변경 시에만 재빌드
  # ★ profile 뒤에 둔다 = 기본 `up -d` 에는 아예 포함되지 않고, 켤 때만 켠다.
  #    `docker compose --profile crawler ... up -d`
  #
  #    왜 profile 인가: crawler/ 는 아직 develop 에 없어(feature/BE-scrapling-crawler)
  #    이미지를 만들 수도 없다. 그런데 compose 는 **띄우지 않을 서비스의 이미지까지 먼저
  #    해석**하므로, 그냥 두면 없는 이미지를 pull 하려다 스택 전체가 기동 실패한다.
  #    (`--scale crawler=0` 으로는 안 된다 — scale 0 이어도 이미지 해석은 그대로 일어남.
  #     실제로 검증했고, profile 만이 서비스를 프로젝트에서 빼준다.)
  #
  #    앱 쪽 스위치는 별개다: 크롤러를 안 띄웠으면 .env 의 CRAWLER_ENABLED=false 도 같이 꺼서
  #    백엔드가 호출조차 안 하게 한다.
  #
  # 변수에 :? 를 걸지 않는 이유: 크롤러를 안 쓰는 경우에도 compose 는 이 블록을 해석하므로,
  # 필수로 걸면 안 쓰는 서비스 때문에 .env 를 채워야 하는 상황이 된다.
  crawler:
    profiles: ["crawler"]
    image: ${CRAWLER_IMAGE:-woojuin-crawler:latest}
    environment:
      CRAWLER_SOLVE_CLOUDFLARE: ${CRAWLER_SOLVE_CLOUDFLARE:-true}
      CRAWLER_MAX_CONCURRENCY: ${CRAWLER_MAX_CONCURRENCY:-2}
    shm_size: "1gb"   # 브라우저 렌더 중 /dev/shm 부족 크래시 방지
    networks: [internal]
    restart: always
    mem_limit: ${CRAWLER_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    # Jenkins가 EC2에서 직접 빌드하고 커밋 SHA로 태깅한 이미지(결정 #9).
    # 빌드하는 곳 = 실행하는 곳이라 별도 레지스트리가 필요 없다.
    image: ${BACKEND_IMAGE:?}
    # 컨테이너에 넘길 값을 전부 여기 명시한다. 값의 출처는 `--env-file` 로 넘긴 파일이다.
    #
    # env_file: 로 파일을 통째로 주입하지 않는 이유 (env_file 도 절대경로를 받으므로
    # "경로 문제" 때문은 아니다. 애초에 둘은 대안 관계가 아니다):
    #   - --env-file 은 이 파일 안의 ${...} **치환용**이고 컨테이너에 자동 전달되지 않는다.
    #     env_file: 은 컨테이너 **주입용**이고 치환에는 쓸 수 없다. 이 파일은 호스트 포트·
    #     이미지 태그·mem_limit 에 치환이 필요하므로 --env-file 이 어차피 필수다.
    #   - ★ 아래 배선 값(DB_URL/REDIS_HOST/AWS_S3_ENDPOINT)을 **하드 오버라이드**할 수 있다.
    #     서버 .env 는 로컬 .env 를 보고 만들게 되는데, localhost 가 한 줄이라도 남으면
    #     env_file: 방식은 그대로 주입돼 컨테이너가 자기 자신을 찾다 죽는다.
    #   - compose 전용 변수(BACKEND_HOST_PORT·*_MEM_LIMIT 등)가 앱 환경에 새어들지 않는다.
    #   - .gitignore 의 .env.* 규칙 때문에 템플릿을 레포에 둘 수 없어, 이 블록이 레포 안에서
    #     "앱이 무엇을 받는지"를 보여주는 유일한 명세다.
    # 대가: 백엔드가 새 변수를 추가하면 여기도 고쳐야 한다(안 고치면 옵셔널 값은 조용히 빔).
    environment:
      # 컨테이너 네트워크 주소로 못박는 것들 (.env 에 localhost 가 남아 있어도 무시됨)
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 운영도 자체 MinIO를 쓴다(결정 #19). 비우면 백엔드가 실제 AWS S3 모드로
      # 전환되는데 AWS 계정이 없어 버킷 확인 단계에서 기동이 실패한다.
      AWS_S3_ENDPOINT: http://minio:9000
      CRAWLER_BASE_URL: http://crawler:8001
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:-}

      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?}
      # 비어 있으면 ClientRegistration 검증에서 기동 자체가 실패한다.
      # :? 로 걸어 60초 뒤 앱 로그가 아니라 compose 단계에서 즉시 드러나게 한다.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
      # 프론트 origin. 빠지면 yml 기본값 http://localhost:5173 로 조용히 떨어져서
      # 브라우저의 모든 API 호출이 CORS 로 막힌다(curl 로는 안 잡히는 종류의 사고).
      # OAUTH_REDIRECT_BASE_URL 과 같은 origin 이어야 한다.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:?}
      # 없으면 AI 분석이 NoOp 으로 대체될 뿐 기동은 된다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      # 기본값은 false — 컨테이너가 profile 로 기본 OFF 이므로 앱 스위치도 기본 OFF 로 맞춘다.
      # true 였다면 .env 에 이 줄을 빼먹었을 때 "없는 크롤러를 있다고 믿고 호출"하게 되어
      # 요청 실패·타임아웃으로 번진다. 변수 누락이 기능을 켜는 쪽으로 기울면 안 된다.
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    # 8080은 Jenkins가 쓰고 있으므로 호스트 포트를 달리 잡는다(prod 8081 / dev 8091)
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:?}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # crawler 는 일부러 넣지 않는다.
      #   - profile 로 뺀 서비스를 depends_on 에 남기면 compose 가
      #     `depends on undefined service "crawler"` 로 프로젝트 자체를 거부한다(검증함).
      #   - 애초에 `condition: service_started` 는 "떴다"만 보장하고 준비 완료를 보장하지
      #     않는다(크롤러 healthcheck 의 start_period 가 30s). 폴백 전용이라 백엔드는
      #     어차피 런타임에 "크롤러 없음"을 견뎌야 하므로, 이 의존은 얻는 게 없었다.
    networks: [internal]
    restart: always
    mem_limit: ${BACKEND_MEM_LIMIT:?}
    # actuator 의 health 는 DataSource·Redis 를 실제로 확인해 하나라도 끊기면 DOWN(503)을
    # 반환한다. 그래서 이 판정을 무중단 배포의 전환 게이트로 쓸 수 있다
    # (새 슬롯이 healthy 일 때만 트래픽을 넘기고, 아니면 전환하지 않아 구버전이 유지됨).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# 외부에 열린 문은 호스트 nginx(80/443)뿐이고, 이 네트워크는 컨테이너끼리만 쓴다.
networks:
  internal:

# -p 프로젝트명이 접두사로 붙어 dev/prod 데이터가 서로 섞이지 않는다.
volumes:
  postgres-data:
  redis-data:
  minio-data:
