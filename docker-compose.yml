# 로컬 개발용 인프라 (PostgreSQL + Redis + MinIO)
# 사용: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: woojuin-postgres
    environment:
      POSTGRES_DB: woojuin
      POSTGRES_USER: woojuin
      POSTGRES_PASSWORD: woojuin-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: woojuin-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: woojuin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: woojuin
      MINIO_ROOT_PASSWORD: woojuin-local
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 콘솔
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
