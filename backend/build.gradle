plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.ssafy'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 루트의 .env를 자동으로 읽어 환경변수로 주입 (별도 export 없이 bootRun 가능).
    // spring-dotenv(코어)는 수동 등록이 필요해 Boot 3 auto-registration이 되는
    // springboot3-dotenv를 써야 한다.
    implementation 'me.paulschwarz:springboot3-dotenv:5.1.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // 크롤링 / 본문 추출 (트랙 B)
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'net.dankito.readability4j:readability4j:1.0.8'

    // S3 업로드
    implementation 'software.amazon.awssdk:s3:2.29.52'

    // 이미지 썸네일 생성 (IMAGE 목록 카드용 저용량 webp). scrimage-webp는 리사이즈/webp
    // 인코딩에 번들 네이티브 바이너리(libwebp)를 쓴다 — Alpine(musl)/ARM에선 안 맞을 수
    // 있어, 생성 실패 시 목록은 원본 presigned로 폴백한다(ImageItemProcessor 참고).
    implementation 'com.sksamuel.scrimage:scrimage-core:4.3.0'
    implementation 'com.sksamuel.scrimage:scrimage-webp:4.3.0'

    // Swagger UI (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// spring-dotenv는 EnvironmentPostProcessor라서 application.yml이 다 읽히기 전에
// 실행된다 — springdotenv.directory를 application.yml에 적어도 무시된다.
// JVM 시스템 프로퍼티는 부팅 즉시 존재하는 프로퍼티 소스라 이 시점에도 보인다.
tasks.named('bootRun') {
    systemProperty 'springdotenv.directory', file("$rootDir/..").canonicalPath
}
